{% extends "base.html" %}
{% block title %}Admin – Kategorie{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-collection"></i> Kategorie</h2>
    <a href="{{ url_for('admin_category_new') }}" class="btn btn-success">
        <i class="bi bi-plus-lg"></i> Nová kategorie
    </a>
</div>

<div class="row g-4">
    {% for cat in categories %}
    <div class="col-md-6 col-lg-4">
        <div class="card h-100" style="border-left: 4px solid {{ cat.color }};">
            <div class="card-body">
                <h5>{{ cat.icon }} {{ cat.name }}</h5>
                <p class="text-muted small">{{ cat.description }}</p>
                <div class="btn-group btn-group-sm">
                    <a href="{{ url_for('admin_category_edit', cat_id=cat.id) }}" class="btn btn-outline-primary">
                        <i class="bi bi-pencil"></i> Upravit
                    </a>
                    <form method="POST" action="{{ url_for('admin_category_delete', cat_id=cat.id) }}"
                          onsubmit="return confirm('Smazat kategorii {{ cat.name }}?');" class="d-inline">
                        <button class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i> Smazat</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
