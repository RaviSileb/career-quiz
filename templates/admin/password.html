{% extends "base.html" %}
{% block title %}Admin – Změna hesla{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4"><i class="bi bi-key"></i> Změna hesla</h2>
        <form method="POST">
            <div class="card">
                <div class="card-body">
                    <div class="mb-3">
                        <label for="old_password" class="form-label">Staré heslo</label>
                        <input type="password" class="form-control" id="old_password" name="old_password" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">Nové heslo</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Potvrzení nového hesla</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Změnit heslo</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary ms-2">Zpět</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
