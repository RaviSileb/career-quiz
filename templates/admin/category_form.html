{% extends "base.html" %}
{% block title %}Admin – {{ 'Upravit' if category else 'Nová' }} kategorie{% endblock %}

{% block content %}
<h2 class="mb-4">
    <i class="bi bi-collection"></i>
    {{ 'Upravit kategorii' if category else 'Nová kategorie' }}
</h2>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Název kategorie *</label>
                        <input type="text" class="form-control" id="name" name="name"
                               value="{{ category.name if category else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Popis</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ category.description if category else '' }}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="icon" class="form-label">Ikona (emoji)</label>
                            <input type="text" class="form-control" id="icon" name="icon"
                                   value="{{ category.icon if category else '📁' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="color" class="form-label">Barva</label>
                            <input type="color" class="form-control form-control-color" id="color" name="color"
                                   value="{{ category.color if category else '#3498db' }}">
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-lg"></i> {{ 'Uložit změny' if category else 'Vytvořit' }}
                        </button>
                        <a href="{{ url_for('admin_categories') }}" class="btn btn-outline-secondary">Zpět</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
